name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1). Leave empty to auto-bump from last git tag.'
        required: false
        type: string
      debug:
        description: 'Also build the debug APK (tuklas-development.apk)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME not set"
          ls /usr/local/lib/android/sdk 2>/dev/null || echo "sdk dir missing"
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            LAST_TAG=$(git tag --list 'v*.*.*' | sed 's/^v//' | sort -V | tail -1)
            if [ -z "$LAST_TAG" ]; then
              echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
              echo "version=$MAJOR.$MINOR.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump version in app.json
        run: |
          node -e "
            const fs = require('fs');
            const v = '${{ steps.version.outputs.version }}'.split('.').map(Number);
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const code = Number(app.expo.android.versionCode || 0) + 1;
            app.expo.version = v.join('.');
            app.expo.android.versionCode = code;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('Bumped to v' + v.join('.') + ' (versionCode ' + code + ')');
          "

      - name: Expo prebuild
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        run: ./android/gradlew -p android assembleRelease

      - name: Build debug APK
        if: inputs.debug == true
        run: ./android/gradlew -p android assembleDebug

      - name: Stage APKs
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/tuklas.apk
          if [ "${{ inputs.debug }}" == "true" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk/tuklas-development.apk
          fi
          ls -lh apk/

      - name: Commit version bump
        run: |
          git config user.name "tuklas-bot"
          git config user.email "tuklas-bot@users.noreply.github.com"
          git add app.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          ASSETS="apk/tuklas.apk"
          if [ "${{ inputs.debug }}" == "true" ]; then
            ASSETS="$ASSETS apk/tuklas-development.apk"
          fi
          gh release create "v${{ steps.version.outputs.version }}" $ASSETS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tuklas-Basa ${{ steps.version.outputs.version }}" \
            --notes "Production preview build ${{ steps.version.outputs.version }} (APK built on GitHub Actions, no EAS cloud queue)."